  build-base:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_base == true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: x86
            dockerfile: docker/Dockerfile.base.x86
            target_platform: linux/amd64
            base_image: 'nvidia/cuda:12.9.0-devel-ubuntu22.04'
          - platform: agx
            dockerfile: docker/Dockerfile.base.agx
            target_platform: linux/arm64
            base_image: 'nvcr.io/nvidia/l4t-jetpack:r36.4.0'
          - platform: nano
            dockerfile: docker/Dockerfile.base.nano
            target_platform: linux/arm64
            base_image: 'nvidia/cuda:12.6.3-devel-ubuntu24.04'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache,mode=max