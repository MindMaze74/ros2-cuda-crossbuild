# ============================================================================
# CI/CD Pipeline для кросс-платформенной сборки ROS2-пакетов с CUDA
# ============================================================================
# Триггеры: push в main/feature, теги, ручной запуск
# Платформы: x86 (amd64), agx (arm64 Jetson AGX), nano (arm64 Jetson Nano)
#
# Конфигурация пакетов читается из config/packages.yaml.
# Добавление нового пакета не требует правки workflow.
# ============================================================================
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags: [ 'v*' ]
    paths:
      - 'docker/**'
      - 'config/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_base:
        description: 'Rebuild base images'
        type: boolean
        default: false
      build_packages:
        description: 'Rebuild package images'
        type: boolean
        default: true
      package:
        description: 'Package name (empty = all)'
        default: ''
      platform:
        description: 'Platform: x86 | agx | nano (empty = all)'
        default: ''

# GITHUB_TOKEN автоматически имеет права на GHCR в рамках репозитория.
# Не нужен PAT, который истекает и требует ручного обновления.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  # ==========================================================================
  # JOB 1: Base images — пересборка только при изменении docker/base/**
  # ==========================================================================
  build-base:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_base == true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # избегаем GHCR rate limit
      matrix:
        include:
          - platform: x86
            dockerfile: docker/Dockerfile.base.x86
            target_platform: linux/amd64
            base_image: 'nvidia/cuda:12.9.0-devel-ubuntu22.04'
          - platform: agx
            dockerfile: docker/Dockerfile.base.agx
            target_platform: linux/arm64
            base_image: 'nvcr.io/nvidia/l4t-jetpack:r36.4.0'
          - platform: nano
            dockerfile: docker/Dockerfile.base.nano
            target_platform: linux/arm64
            base_image: 'nvidia/cuda:12.6.3-devel-ubuntu24.04'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache,mode=max

  # ==========================================================================
  # JOB 2: Setup — генерирует матрицу пакетов из config/packages.yaml
  # ==========================================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: mikefarah/yq@v4

      - name: Generate matrix from packages.yaml
        id: generate
        run: |
          # Читаем все пакеты
          PACKAGES=$(yq -o=json -I=0 '.packages' config/packages.yaml)

          # Фильтрация по выбранному пакету (workflow_dispatch)
          SELECTED_PKG="${{ github.event.inputs.package }}"
          if [ -n "$SELECTED_PKG" ]; then
            PACKAGES=$(echo "$PACKAGES" | jq --arg p "$SELECTED_PKG" '[.[] | select(.name == $p)]')
          fi

          # Платформы с их runner'ами и CUDA-архитектурами
          PLATFORMS='[
            {"platform":"x86","target_platform":"linux/amd64","runner":"ubuntu-latest","native":false},
            {"platform":"agx","target_platform":"linux/arm64","runner":"ubuntu-latest","native":false},
            {"platform":"nano","target_platform":"linux/arm64","runner":"ubuntu-latest","native":false}
          ]'

          SELECTED_PLAT="${{ github.event.inputs.platform }}"
          if [ -n "$SELECTED_PLAT" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg p "$SELECTED_PLAT" '[.[] | select(.platform == $p)]')
          fi

          # Декартово произведение: пакет × платформа
          MATRIX=$(jq -nc \
            --argjson pkgs "$PACKAGES" \
            --argjson plats "$PLATFORMS" \
            '{include: [
              $plats[] as $p | $pkgs[] as $pkg | {
                platform: $p.platform,
                target_platform: $p.target_platform,
                runner: $p.runner,
                package: $pkg.name,
                repo: $pkg.repo,
                branch: $pkg.branch,
                package_name: $pkg.package_name,
                ros_distro: $pkg.ros_distro,
                cuda_arch: ($pkg.cuda_arch[$p.platform] // "87"),
                cmake_args: $pkg.cmake_args
              }
            ]}')

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "$MATRIX" | jq .

  # ==========================================================================
  # JOB 3: Build packages — собирает каждый пакет на каждой платформе
  # ==========================================================================
  build-packages:
    needs: [build-base, setup]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.build_packages == true))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1  # избегаем GHCR rate limit
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.target_platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push package image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.package
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:latest
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            REPO_URL=${{ matrix.repo }}
            BRANCH=${{ matrix.branch }}
            PACKAGE_NAME=${{ matrix.package_name }}
            ROS_DISTRO=${{ matrix.ros_distro }}
            CMAKE_ARGS=${{ matrix.cmake_args }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}-${{ matrix.platform }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}-${{ matrix.platform }}:buildcache,mode=max

      # Сканирование уязвимостей через Trivy
      - name: Run Trivy vulnerability scanner
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==========================================================================
  # JOB 4: Test images — проверяет, что образы содержат CUDA и ROS2-пакет
  # ==========================================================================
  test-images:
    needs: build-packages
    if: always() && needs.build-packages.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.target_platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Pull and test image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}"
          ROS_DISTRO="${{ matrix.ros_distro }}"
          echo "Testing image: $IMAGE (ROS2 $ROS_DISTRO)"
          docker pull "$IMAGE"

          PLATFORM_FLAG=""
          if [ "${{ matrix.target_platform }}" = "linux/arm64" ]; then
            PLATFORM_FLAG="--platform linux/arm64"
          fi

          echo "=== 1. CUDA version ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" nvcc --version

          echo "=== 2. ROS2 distro ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "source /opt/ros/${ROS_DISTRO}/setup.bash && echo ROS_DISTRO=\$ROS_DISTRO"

          echo "=== 3. Build artifacts ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" ls -la /opt/ros_ws/install/

          echo "=== 4. ROS2 package present ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "source /opt/ros/${ROS_DISTRO}/setup.bash && source /opt/ros_ws/install/setup.bash && ros2 pkg list | grep ${{ matrix.package_name }}" || true

          echo "All tests passed for $IMAGE"