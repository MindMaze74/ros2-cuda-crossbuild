name: CI/CD Pipeline - ROS2 FastLIO Build

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fastlio-ros2-images

jobs:
  # ----------------------------------------------------------------------
  # JOB 1: Сборка базовых образов (build-base)
  # Создает 3 базовых образа с установленным ROS2 Humble и зависимостями.
  # ----------------------------------------------------------------------
  build-base:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [x86, agx, nano]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        # Необходимо для эмуляции ARM инструкций на x86 раннере GitHub Actions
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: "--debug"
          driver-opts: network.host=true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: \${{ env.REGISTRY }}
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}

      - name: Build Base Image (Platform: \${{ matrix.platform }})
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.base.\${{ matrix.platform }}
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:base-${{ matrix.platform }}-latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:base-${{ matrix.platform }}-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:base-${{ matrix.platform }}-buildcache,mode=max
          # Передаем архитектуру CUDA как аргумент, если она используется внутри Dockerfile для условной логики
          build-args: |
            CUDA_ARCH=\${{ matrix.cuda_arch }}

  # ----------------------------------------------------------------------
  # JOB 2: Сборка пакетов (build-packages)
  # Собирает FAST_LIO2 с правильными флагами для каждой платформы.
  # Зависит от успешного завершения build-base.
  # ----------------------------------------------------------------------
  build-packages:
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: x86
            dockerfile: docker/Dockerfile.package.x86
            cuda_arch: "86"
            target: package-x86
          - platform: agx
            dockerfile: docker/Dockerfile.package.agx
            cuda_arch: "87"
            target: package-agx
          - platform: nano
            dockerfile: docker/Dockerfile.package.nano
            cuda_arch: "53"
            target: package-nano

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: "--debug"
          driver-opts: network.host=true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: \${{ env.REGISTRY }}
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages (Platform: \${{ matrix.platform }})
        uses: docker/build-push-action@v4
        with:
          context: .
          file: \${{ matrix.dockerfile }}
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:pkg-${{ matrix.platform }}-latest
          # Кэшируем слои сборки, чтобы не клонировать git и не ставить rosdep каждый раз
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:pkg-${{ matrix.platform }}-buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:pkg-${{ matrix.platform }}-buildcache,mode=max
          build-args: |
            PACKAGE_NAME=fast_lio
            CUDA_ARCH=\${{ matrix.cuda_arch }}
            CMAKE_CUDA_FLAGS="--expt-relaxed-constexpr --expt-extended-lambda"

  # ----------------------------------------------------------------------
  # JOB 3: Публикация финальных образов (опционально)
  # Если нужно сохранить готовые образы в реестре.
  # ----------------------------------------------------------------------
  publish:
    needs: build-packages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: \${{ env.REGISTRY }}
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}

      - name: Push Final Images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.actor }}/\${{ env.IMAGE_NAME }}:pkg-x86-latest
          docker tag ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:pkg-x86-latest ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:latest-x86
          docker push ${{ env.REGISTRY }}/${{ github.actor }}/\${{ env.IMAGE_NAME }}:latest-x86

          docker pull ${{ env.REGISTRY }}/${{ github.actor }}/\${{ env.IMAGE_NAME }}:pkg-agx-latest
          docker tag ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:pkg-agx-latest ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:latest-agx
          docker push ${{ env.REGISTRY }}/${{ github.actor }}/\${{ env.IMAGE_NAME }}:latest-agx

          docker pull ${{ env.REGISTRY }}/${{ github.actor }}/\${{ env.IMAGE_NAME }}:pkg-nano-latest
          docker tag ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:pkg-nano-latest ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:latest-nano
          docker push ${{ env.REGISTRY }}/${{ github.actor }}/\${{ env.IMAGE_NAME }}:latest-nano
