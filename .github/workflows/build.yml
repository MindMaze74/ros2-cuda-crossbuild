# .github/workflows/build.yml
#
# Сборка базовых образов и ROS2-пакетов с CUDA.
# Конфигурация пакетов — config/packages.yaml.
#
# Поддерживается два способа сборки ARM64:
#   1. Кросс-сборка через QEMU на ubuntu-latest (по умолчанию).
#   2. Нативная сборка на self-hosted runner'е (Jetson AGX / Nano).
#      Включается флагом build_native_arm при ручном запуске.
#
# Ключевые особенности:
#   - digest базовых образов вместо :latest — воспроизводимость
#   - per-job permissions (least privilege)
#   - timeout-minutes, concurrency — защита от зависаний и наложения
#   - двухуровневый кеш: actions/cache (local) + registry
#   - smoke-тест компиляции CUDA + ldd-проверка зависимостей
#   - ros_distro резолвится по платформе (map в packages.yaml)
#   - фильтр по полю platforms (пакет × платформа)

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags: ['v*']
    paths:
      - 'docker/**'
      - 'config/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_base:
        description: 'Rebuild base images'
        type: boolean
        default: false
      build_packages:
        description: 'Rebuild package images'
        type: boolean
        default: true
      build_native_arm:
        description: 'Build natively on self-hosted Jetson runners (requires runners)'
        type: boolean
        default: false
      package:
        description: 'Package'
        type: choice
        options:
          - all
          - fastlio2
          - fastlivo2
        default: all
      platform:
        description: 'Platform: x86 | agx | nano (empty = all)'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  # ---------------------------------------------------------------------------
  # Базовые образы
  # ---------------------------------------------------------------------------
  build-base:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_base == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: x86
            dockerfile: docker/Dockerfile.base.x86
            target_platform: linux/amd64
            base_image: 'nvidia/cuda:12.9.0-devel-ubuntu22.04'
          - platform: agx
            dockerfile: docker/Dockerfile.base.agx
            target_platform: linux/arm64
            base_image: 'nvcr.io/nvidia/l4t-jetpack:r36.4.0'
          - platform: nano
            dockerfile: docker/Dockerfile.base.nano
            target_platform: linux/arm64
            base_image: 'nvidia/cuda:12.6.3-devel-ubuntu24.04'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker system prune -af || true
          docker builder prune -af || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: |
          echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Cache BuildKit
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-base-${{ matrix.platform }}-${{ hashFiles('docker/Dockerfile.base.*') }}
          restore-keys: buildx-base-${{ matrix.platform }}-

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:latest
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-new,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache,mode=max

      - name: Rotate BuildKit cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ---------------------------------------------------------------------------
  # Setup: матрица пакетов
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          hash -r
          yq --version

      - name: Generate matrix
        id: generate
        run: |
          set -euo pipefail

          PACKAGES=$(yq -o=json -I=0 '.packages' config/packages.yaml)

          SELECTED_PKG="${{ github.event.inputs.package }}"
          if [ -n "$SELECTED_PKG" ] && [ "$SELECTED_PKG" != "all" ]; then
            PACKAGES=$(echo "$PACKAGES" | jq --arg p "$SELECTED_PKG" '[.[] | select(.name == $p)]')
          fi

          PLATFORMS='[
            {"platform":"x86","target_platform":"linux/amd64","runner":"ubuntu-latest","build_type":"cross"},
            {"platform":"agx","target_platform":"linux/arm64","runner":"ubuntu-latest","build_type":"cross"},
            {"platform":"nano","target_platform":"linux/arm64","runner":"ubuntu-latest","build_type":"cross"}
          ]'

          SELECTED_PLAT="${{ github.event.inputs.platform }}"
          if [ -n "$SELECTED_PLAT" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg p "$SELECTED_PLAT" '[.[] | select(.platform == $p)]')
          fi

          if [ "${{ github.event.inputs.build_native_arm }}" = "true" ]; then
            NATIVE_PLATFORMS='[
              {"platform":"agx","target_platform":"linux/arm64","runner":["self-hosted","arm64","jetson-agx"],"build_type":"native"},
              {"platform":"nano","target_platform":"linux/arm64","runner":["self-hosted","arm64","jetson-nano"],"build_type":"native"}
            ]'
            if [ -n "$SELECTED_PLAT" ]; then
              NATIVE_PLATFORMS=$(echo "$NATIVE_PLATFORMS" | jq --arg p "$SELECTED_PLAT" '[.[] | select(.platform == $p)]')
            fi
            PLATFORMS=$(echo "$PLATFORMS" | jq --argjson n "$NATIVE_PLATFORMS" '. + $n')
          fi

          MATRIX=$(jq -nc \
            --argjson pkgs "$PACKAGES" \
            --argjson plats "$PLATFORMS" \
            '{include: [
              $pkgs[] as $pkg |
              $plats[] as $p |
              if ($pkg.platforms // null) != null
                 and (($pkg.platforms | index($p.platform)) == null)
              then empty
              else {
                platform: $p.platform,
                target_platform: $p.target_platform,
                runner: $p.runner,
                build_type: $p.build_type,
                package: $pkg.name,
                repo: $pkg.repo,
                branch: $pkg.branch,
                package_name: $pkg.package_name,
                ros_distro: (
                  if ($pkg.ros_distro | type) == "object"
                  then $pkg.ros_distro[$p.platform]
                  else $pkg.ros_distro
                  end
                ),
                cuda_arch: ($pkg.cuda_arch[$p.platform] // "87"),
                cmake_args: $pkg.cmake_args
              }
              end
            ]}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "$MATRIX" | jq .

          echo ""
          echo "Matrix size: $(echo "$MATRIX" | jq '.include | length')"
          echo "$MATRIX" | jq -r '.include[] | "  - \(.package) × \(.platform) [\(.build_type)] (ros=\(.ros_distro))"'

  # ---------------------------------------------------------------------------
  # Пакеты
  # ---------------------------------------------------------------------------
  build-packages:
    needs: [build-base, setup]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.build_packages == true))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.build_type == 'native' && 15 || 120 }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker system prune -af || true
          docker builder prune -af || true

      - name: Set up QEMU
        if: matrix.target_platform == 'linux/arm64' && matrix.build_type == 'cross'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: |
          echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Cache BuildKit
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-pkg-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.build_type }}-${{ hashFiles('docker/Dockerfile.package') }}
          restore-keys: buildx-pkg-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.build_type }}-

      - name: Resolve base image reference
        id: base_ref
        run: |
          set -euo pipefail
          REPO_NAME="${{ steps.repo.outputs.NAME }}"
          PLATFORM="${{ matrix.platform }}"
          BASE_TAG="${REGISTRY}/${REPO_NAME}/ros2-base-${PLATFORM}:latest"

          if DIGEST=$(docker buildx imagetools inspect "$BASE_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            REF="${REGISTRY}/${REPO_NAME}/ros2-base-${PLATFORM}@${DIGEST}"
            echo "Resolved digest: $DIGEST"
          else
            REF="$BASE_TAG"
            echo "::warning::Не удалось получить digest для $BASE_TAG, fallback на :latest"
          fi

          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Using base: $REF"

      - name: Build and push package image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.package
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}${{ matrix.build_type == 'native' && '-native' || '' }}
          build-args: |
            BASE_IMAGE=${{ steps.base_ref.outputs.ref }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            REPO_URL=${{ matrix.repo }}
            BRANCH=${{ matrix.branch }}
            PACKAGE_NAME=${{ matrix.package_name }}
            ROS_DISTRO=${{ matrix.ros_distro }}
            CMAKE_ARGS=${{ matrix.cmake_args }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.build_type }}:buildcache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-new,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.build_type }}:buildcache,mode=max

      - name: Rotate BuildKit cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ---------------------------------------------------------------------------
  # Тесты
  # ---------------------------------------------------------------------------
  test-images:
    needs: [build-packages, setup]
    if: always() && needs.build-packages.result == 'success'
    runs-on: ${{ matrix.build_type == 'native' && matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.target_platform == 'linux/arm64' && matrix.build_type == 'cross'
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: |
          echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Pull and test image
        run: |
          set -euo pipefail
          TAG_SUFFIX="${{ matrix.build_type == 'native' && '-native' || '' }}"
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}${TAG_SUFFIX}"
          ROS_DISTRO="${{ matrix.ros_distro }}"

          docker pull "$IMAGE"

          PLATFORM_FLAG=""
          if [ "${{ matrix.target_platform }}" = "linux/arm64" ] && [ "${{ matrix.build_type }}" = "cross" ]; then
            PLATFORM_FLAG="--platform linux/arm64"
          fi

          echo "=== 1. nvcc version ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" nvcc --version

          echo "=== 2. CUDA compile smoke test ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c '
            cat > /tmp/smoke.cu <<EOF
          #include <cuda_runtime.h>
          #include <cstdio>
          int main() {
            int count = 0;
            cudaError_t err = cudaGetDeviceCount(&count);
            if (err != cudaSuccess) {
              printf("cudaGetDeviceCount: %s\n", cudaGetErrorString(err));
              return 0;
            }
            printf("CUDA devices: %d\n", count);
            return 0;
          }
          EOF
            nvcc /tmp/smoke.cu -o /tmp/smoke && /tmp/smoke
          '

          echo "=== 3. ROS2 distro ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "source /opt/ros/${ROS_DISTRO}/setup.bash && echo ROS_DISTRO=\$ROS_DISTRO"

          echo "=== 4. Build artifacts ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" ls -la /opt/ros_ws/install/

          echo "=== 5. ldd check ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "
            source /opt/ros/${ROS_DISTRO}/setup.bash
            source /opt/ros_ws/install/setup.bash
            PKG_PREFIX=\$(ros2 pkg prefix ${{ matrix.package_name }} 2>/dev/null || true)
            if [ -z \"\$PKG_PREFIX\" ]; then
              echo 'WARN: package ${{ matrix.package_name }} not found via ros2 pkg prefix'
              exit 0
            fi
            echo \"Package prefix: \$PKG_PREFIX\"
            BROKEN=0
            for bin in \$(find \"\$PKG_PREFIX/lib\" -type f -executable 2>/dev/null); do
              MISSING=\$(ldd \"\$bin\" 2>/dev/null | grep 'not found' || true)
              if [ -n \"\$MISSING\" ]; then
                echo \"BROKEN: \$bin\"
                echo \"\$MISSING\"
                BROKEN=1
              fi
            done
            if [ \$BROKEN -eq 1 ]; then exit 1; fi
            echo 'All shared libs resolved'
          "

          echo "=== 6. ROS2 package present ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "
            source /opt/ros/${ROS_DISTRO}/setup.bash
            source /opt/ros_ws/install/setup.bash
            ros2 pkg list | grep -E '${{ matrix.package_name }}' || true
          "

          echo "All tests passed for $IMAGE"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Test summary: ${{ matrix.package }} / ${{ matrix.platform }} / ${{ matrix.build_type }}"
            echo ""
            echo "- Image: \`${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}${{ matrix.build_type == 'native' && '-native' || '' }}\`"
            echo "- ROS distro: \`${{ matrix.ros_distro }}\`"
            echo "- CUDA arch: \`${{ matrix.cuda_arch }}\`"
            echo "- Build type: \`${{ matrix.build_type }}\`"
            echo "- Status: ${{ job.status }}"
          } >> $GITHUB_STEP_SUMMARY