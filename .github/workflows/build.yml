# .github/workflows/build.yml
#
# Сборка базовых образов и ROS2-пакетов с CUDA для трёх платформ.
# Конфигурация пакетов читается из config/packages.yaml.

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags: ['v*']
    paths:
      - 'docker/**'
      - 'config/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_base:
        description: 'Rebuild base images'
        type: boolean
        default: false
      build_packages:
        description: 'Rebuild package images'
        type: boolean
        default: true
      package:
        description: 'Package name (empty = all)'
        default: ''
      platform:
        description: 'Platform: x86 | agx | nano (empty = all)'
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  # ---------------------------------------------------------------------------
  # Базовые образы: собираются только при изменении docker/base или вручную
  # ---------------------------------------------------------------------------
  build-base:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_base == true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: x86
            dockerfile: docker/Dockerfile.base.x86
            target_platform: linux/amd64
            base_image: 'nvidia/cuda:12.9.0-devel-ubuntu22.04'
          - platform: agx
            dockerfile: docker/Dockerfile.base.agx
            target_platform: linux/arm64
            base_image: 'nvcr.io/nvidia/l4t-jetpack:r36.4.0'
          - platform: nano
            dockerfile: docker/Dockerfile.base.nano
            target_platform: linux/arm64
            base_image: 'nvidia/cuda:12.6.3-devel-ubuntu24.04'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: |
          echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Ключевой шаг: build-args передаёт BASE_IMAGE внутрь Dockerfile.
      # Без него ARG BASE_IMAGE остаётся пустым → FROM ${BASE_IMAGE} падает.
      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache,mode=max

  # ---------------------------------------------------------------------------
  # Setup: генерирует матрицу пакетов из config/packages.yaml
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: mikefarah/yq@v4
      - name: Generate matrix from packages.yaml
        id: generate
        run: |
          PACKAGES=$(yq -o=json -I=0 '.packages' config/packages.yaml)

          SELECTED_PKG="${{ github.event.inputs.package }}"
          if [ -n "$SELECTED_PKG" ]; then
            PACKAGES=$(echo "$PACKAGES" | jq --arg p "$SELECTED_PKG" '[.[] | select(.name == $p)]')
          fi

          PLATFORMS='[
            {"platform":"x86","target_platform":"linux/amd64","runner":"ubuntu-latest"},
            {"platform":"agx","target_platform":"linux/arm64","runner":"ubuntu-latest"},
            {"platform":"nano","target_platform":"linux/arm64","runner":"ubuntu-latest"}
          ]'
          SELECTED_PLAT="${{ github.event.inputs.platform }}"
          if [ -n "$SELECTED_PLAT" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg p "$SELECTED_PLAT" '[.[] | select(.platform == $p)]')
          fi

          MATRIX=$(jq -nc \
            --argjson pkgs "$PACKAGES" \
            --argjson plats "$PLATFORMS" \
            '{include: [ $plats[] as $p | $pkgs[] as $pkg | {
              platform: $p.platform,
              target_platform: $p.target_platform,
              runner: $p.runner,
              package: $pkg.name,
              repo: $pkg.repo,
              branch: $pkg.branch,
              package_name: $pkg.package_name,
              ros_distro: $pkg.ros_distro,
              cuda_arch: ($pkg.cuda_arch[$p.platform] // "87"),
              cmake_args: $pkg.cmake_args
            } ]}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "$MATRIX" | jq .

  # ---------------------------------------------------------------------------
  # Сборка пакетов: пакет × платформа
  # ---------------------------------------------------------------------------
  build-packages:
    needs: [build-base, setup]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.build_packages == true))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.target_platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: |
          echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push package image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.package
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:latest
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            REPO_URL=${{ matrix.repo }}
            BRANCH=${{ matrix.branch }}
            PACKAGE_NAME=${{ matrix.package_name }}
            ROS_DISTRO=${{ matrix.ros_distro }}
            CMAKE_ARGS=${{ matrix.cmake_args }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}-${{ matrix.platform }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}-${{ matrix.platform }}:buildcache,mode=max

  # ---------------------------------------------------------------------------
  # Тесты: CUDA + ROS2 + артефакты
  # ---------------------------------------------------------------------------
  test-images:
    needs: [build-packages, setup]
    if: always() && needs.build-packages.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.target_platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo
        run: |
          echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Pull and test image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}"
          ROS_DISTRO="${{ matrix.ros_distro }}"
          echo "Testing image: $IMAGE (ROS2 $ROS_DISTRO)"

          docker pull "$IMAGE"

          PLATFORM_FLAG=""
          if [ "${{ matrix.target_platform }}" = "linux/arm64" ]; then
            PLATFORM_FLAG="--platform linux/arm64"
          fi

          echo "=== 1. CUDA version ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" nvcc --version

          echo "=== 2. ROS2 distro ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "source /opt/ros/${ROS_DISTRO}/setup.bash && echo ROS_DISTRO=\$ROS_DISTRO"

          echo "=== 3. Build artifacts ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" ls -la /opt/ros_ws/install/

          echo "=== 4. ROS2 package present ==="
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "source /opt/ros/${ROS_DISTRO}/setup.bash && source /opt/ros_ws/install/setup.bash && ros2 pkg list | grep ${{ matrix.package_name }}" || true

          echo "All tests passed for $IMAGE"