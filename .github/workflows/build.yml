name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'docker/**'
      - 'packages/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_base:
        description: 'Rebuild base images'
        type: boolean
        default: false
      build_packages:
        description: 'Rebuild package images'
        type: boolean
        default: true
      package:
        description: 'Package (empty = all)'
        default: 'fastlio2'
      platform:
        description: 'Platform: x86 | agx | nano (empty/all = all)'
        default: ''

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:

  # ==========================================================================
  # Base
  # ==========================================================================
  build-base:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_base == true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            dockerfile: docker/Dockerfile.base.x86
            target_platform: linux/amd64
          - platform: agx
            dockerfile: docker/Dockerfile.base.agx
            target_platform: linux/arm64
          - platform: nano
            dockerfile: docker/Dockerfile.base.nano
            target_platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Lowercase repo name
        id: repo
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:buildcache,mode=max

  # ==========================================================================
  # Packages — ИСПРАВЛЕННАЯ МАТРИЦА
  # ==========================================================================
  build-packages:
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.build_packages == true))
    needs: build-base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ← ИСПРАВЛЕНО: include содержит полные комбинации
        include:
          - package: fastlio2
            platform: x86
            target_platform: linux/amd64
            cuda_arch: "86"
          - package: fastlio2
            platform: agx
            target_platform: linux/arm64
            cuda_arch: "87"
          - package: fastlio2
            platform: nano
            target_platform: linux/arm64
            cuda_arch: "87"
    steps:
      - uses: actions/checkout@v4

      # ← ИСПРАВЛЕНО: 'all' или пусто → не фильтруем
      - name: Filter platform
        id: filter
        run: |
          SELECTED="${{ inputs.platform }}"
          if [ -z "$SELECTED" ] || [ "$SELECTED" = "all" ] || [ "$SELECTED" = "${{ matrix.platform }}" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Processing ${{ matrix.platform }}"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭ Skipping ${{ matrix.platform }} (selected: $SELECTED)"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.filter.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.filter.outputs.skip == 'false'
      - uses: docker/login-action@v3
        if: steps.filter.outputs.skip == 'false'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Lowercase repo name
        id: repo
        if: steps.filter.outputs.skip == 'false'
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        if: steps.filter.outputs.skip == 'false'
        with:
          context: .
          file: docker/Dockerfile.package
          platforms: ${{ matrix.target_platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-base-${{ matrix.platform }}:latest
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            REPO_URL=https://github.com/ruiqichao/FAST_LIO2_GPU.git
            BRANCH=main
            PACKAGE_NAME=fast_lio
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}-${{ matrix.platform }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-${{ matrix.package }}-${{ matrix.platform }}:buildcache,mode=max

  # ==========================================================================
  # Test — тоже с фильтром по 'all'
  # ==========================================================================
  test-images:
    needs: build-packages
    if: always() && needs.build-packages.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, agx, nano]
    steps:
      - uses: actions/checkout@v4

      # ← ИСПРАВЛЕНО: 'all' или пусто → не фильтруем
      - name: Filter platform
        id: filter
        run: |
          SELECTED="${{ inputs.platform }}"
          if [ -z "$SELECTED" ] || [ "$SELECTED" = "all" ] || [ "$SELECTED" = "${{ matrix.platform }}" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ Testing ${{ matrix.platform }}"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭ Skipping test for ${{ matrix.platform }}"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.filter.outputs.skip == 'false'
      - uses: docker/login-action@v3
        if: steps.filter.outputs.skip == 'false'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Lowercase repo name
        id: repo
        if: steps.filter.outputs.skip == 'false'
        run: echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Pull and test image
        if: steps.filter.outputs.skip == 'false'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.repo.outputs.NAME }}/ros2-package-fastlio2:${{ matrix.platform }}"
          echo "Testing image: $IMAGE"
          docker pull "$IMAGE"

          PLATFORM_FLAG=""
          if [ "${{ matrix.platform }}" != "x86" ]; then
            PLATFORM_FLAG="--platform linux/arm64"
          fi

          docker run --rm $PLATFORM_FLAG "$IMAGE" nvcc --version
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "source /opt/ros/humble/setup.bash && echo ROS_DISTRO=\$ROS_DISTRO"
          docker run --rm $PLATFORM_FLAG "$IMAGE" ls -la /workspace/install/
          docker run --rm $PLATFORM_FLAG "$IMAGE" bash -c "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && ros2 pkg list | grep fast_lio" || true
          echo "✅ All tests passed for $IMAGE"