name: Build Package Images

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [x86, agx, nano]
        package: [fastlio2]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Lowercase repo name
        id: repo-name
        run: |
          echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Read package config
        id: pkg-config
        run: |
          cat packages/${{ matrix.package }}.yaml > package.conf
          echo "PACKAGE_NAME=${{ matrix.package }}" >> $GITHUB_OUTPUT

      - name: Build and push package image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.package
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.REPO_NAME }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.repo-name.outputs.REPO_NAME }}/ros2-base-${{ matrix.platform }}:latest
            CUDA_ARCHITECTURES=${{ contains(matrix.platform, 'x86') && '86' || '87' }}
            REPO_URL=https://github.com/Ericsii/FAST_LIO_ROS2.git
            BRANCH=main
            PACKAGE_NAME=fastlio2
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-images:
    needs: build-packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [x86, agx, nano]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull and test image
        run: |
          IMAGE=ghcr.io/${{ github.repository | to_lower }}/ros2-package-fastlio2:${{ matrix.platform }}
          docker pull $IMAGE
          docker run --rm $IMAGE bash -c "nvcc --version && rosversion -d && ls /workspace/install"
