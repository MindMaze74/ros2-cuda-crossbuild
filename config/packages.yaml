# Список ROS2-пакетов для автоматической сборки.
# Добавление нового пакета — одна запись в массиве packages.
#
# Поля:
#   name         — имя пакета (используется в тегах образов)
#   repo         — Git URL репозитория
#   branch       — ветка
#   package_name — имя пакета внутри репозитория (для colcon --packages-select и ros2 pkg)
#   ros_distro   — ROS2-дистрибутив. Строка (одна на все платформы) или
#                  map { x86, agx, nano }. Humble — Ubuntu 22.04 (x86, agx),
#                  Jazzy — Ubuntu 24.04 (nano).
#   cuda_arch    — CUDA_ARCHITECTURES для каждой платформы
#                  x86 — 86 (Ampere), agx — 87 (Orin), nano — 87 (Orin)
#   cmake_args   — дополнительные флаги CMake
#   extra_deps   — (опционально) список доп. зависимостей, которые нужно
#                  доставить в Dockerfile.package перед colcon build.
#                  Сейчас поддерживается "sophus" и "vikit".

packages:
  - name: fastlio2
    repo: https://github.com/ruiqichao/FAST_LIO2_GPU.git
    branch: main
    package_name: fast_lio
    ros_distro:
      x86: humble
      agx: humble
      nano: jazzy
    cuda_arch:
      x86: "86"
      agx: "87"
      nano: "87"
    cmake_args: "-DCMAKE_BUILD_TYPE=Release -DFASTLIO_USE_CUDA=ON -DBUILD_TESTING=OFF"

  - name: fastlivo2
    repo: https://github.com/hku-mars/FAST-LIVO2.git
    branch: main
    package_name: fast_livo
    ros_distro:
      x86: humble
      agx: humble
      nano: jazzy
    cuda_arch:
      x86: "86"
      agx: "87"
      nano: "87"
    cmake_args: "-DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF"
    # FAST-LIVO2 тянет Sophus и Vikit (rpg_vikit). Их ставим условно
    # в Dockerfile.package — по флагу PACKAGE_NAME.
    extra_deps:
      - sophus
      - vikit