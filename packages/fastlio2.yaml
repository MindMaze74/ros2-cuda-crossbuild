name: fastlio2
repo: https://github.com/ruiqichao/FAST_LIO2_GPU.git
branch: main
ros_distro: humble
cuda_arch:
  x86: "86"
  agx: "87"
  nano: "87"
description: "GPU-accelerated FAST-LIO2 for ROS2 with CUDA support"
dependencies:
  - livox-SDK2
  - livox_ros_driver2
  - pcl
  - eigen3
cmake_args:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DFASTLIO_USE_CUDA=ON"
  - "-DBUILD_TESTING=OFF"
